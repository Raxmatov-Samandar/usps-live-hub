<style>
:root {
  --bg: #050C1C;
  --text: #F3F6FF; --soft: #C3D0EA; --muted: #8296BE;
  --line: rgba(70, 130, 235, .30); --line-soft: rgba(70, 130, 235, .16);
  --field: rgba(9, 22, 50, .82);
  --blue: #2E8BFF; --blue-hi: #6FB0FF;
  --open: #2FE39A; --soon: #FFC53D; --exp: #FF4D6A; --team: #A57CFF; --solo: #3AA8FF;
  --font: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --cond: "Barlow Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg) url("/static/bg.webp") center top / cover no-repeat fixed;
  color: var(--text); font: 15px/1.4 var(--font); font-variant-numeric: tabular-nums;
  min-height: 100vh; padding-bottom: env(safe-area-inset-bottom, 0px);
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue-hi); outline-offset: 2px; }
.wrap { max-width: 1680px; margin: 0 auto; padding: 0 24px; }

/* umumiy "shisha" panel */
.card {
  position: relative;
  background: linear-gradient(180deg, rgba(22, 46, 96, .55), rgba(8, 19, 42, .88));
  border: 1px solid var(--line); border-radius: 16px;
  box-shadow: inset 0 1px 0 rgba(140, 185, 255, .10), 0 12px 32px rgba(0, 0, 0, .35), 0 0 24px rgba(36, 110, 255, .10);
}

/* ---------- header ---------- */
.top { position: relative; overflow: hidden; padding-top: env(safe-area-inset-top, 0px); }
.top .wrap { position: relative; display: flex; align-items: center; gap: 24px; min-height: 112px; }
.brand { display: flex; align-items: center; gap: 26px; z-index: 1; min-width: 0; }
.mark { height: 46px; width: auto; flex: none; color: #fff; display: block; }
.sep { width: 2px; height: 62px; flex: none; background: linear-gradient(transparent, rgba(160, 190, 255, .7), transparent); }
.brand h1 { font: 700 42px/1 var(--cond); margin: 0; letter-spacing: .005em; white-space: nowrap; }
.brand p { margin: 6px 0 0; font: 500 20px/1.1 var(--cond); color: var(--soft); white-space: nowrap; }
.hstat {
  display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 14px; z-index: 1;
  margin-left: clamp(24px, 13vw, 270px); flex: none;
  background: linear-gradient(180deg, rgba(20, 42, 88, .55), rgba(8, 18, 40, .75));
  border: 1px solid var(--line);
}
.clockbox { padding: 6px 18px 6px 14px; }
.clockbox b { font: 700 22px/1 var(--cond); }
.clockbox b span { font: 500 15px var(--cond); color: var(--soft); margin-left: 3px; }
.clockbox small { display: block; color: var(--soft); font: 500 15px/1.2 var(--cond); margin-top: 6px; white-space: nowrap; }
.livebox {
  display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 11px;
  background: rgba(16, 40, 92, .6); border: 1px solid var(--line);
}
.livebox i { width: 18px; height: 18px; border-radius: 50%; flex: none; background: var(--muted); }
.livebox b { display: block; font: 700 21px/1 var(--cond); color: var(--soft); white-space: nowrap; }
.livebox small { display: block; font: 500 14px/1.2 var(--font); color: var(--soft); margin-top: 3px; white-space: nowrap; }
.livebox[data-s="live"] i { background: var(--open); box-shadow: 0 0 0 4px rgba(47, 227, 154, .18), 0 0 14px var(--open); animation: pulse 2.4s infinite; }
.livebox[data-s="live"] b { color: var(--open); }
.livebox[data-s="warn"] i { background: var(--soon); box-shadow: 0 0 12px var(--soon); }
.livebox[data-s="warn"] b { color: var(--soon); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(47, 227, 154, .55), 0 0 14px var(--open); } 70%, 100% { box-shadow: 0 0 0 9px transparent, 0 0 14px var(--open); } }
.snd {
  width: 34px; height: 34px; margin: 0 4px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center;
  background: none; border: 1px solid transparent; color: var(--muted); cursor: pointer;
}
.snd:hover { color: var(--text); border-color: var(--line); }
.snd[aria-pressed="true"] { color: var(--blue-hi); border-color: var(--line); }
.hero { position: absolute; top: 0; right: 0; bottom: 0; width: 600px; pointer-events: none; }
/* rasm 2000x667: yuk mashinasi x≈1235–1740 da; 190px balandlikda u qutining ~160–380px oralig'iga tushadi, o'ng tomoni shiorga joy qoldiradi */
.hero::before {
  content: ""; position: absolute; inset: 0;
  background: url("/static/hero-truck.webp") -190px 52% / auto 190px no-repeat;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 18%, #000 56%, transparent 66%);
  mask-image: linear-gradient(90deg, transparent 0, #000 18%, #000 56%, transparent 66%);
}
.hero p {
  position: absolute; right: 30px; top: 50%; transform: translateY(-50%); margin: 0;
  font: 600 21px/1.02 var(--cond); text-transform: uppercase; color: var(--soft); letter-spacing: .02em;
}
.hero p b { display: block; color: var(--blue); font-weight: 700; }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 386px; gap: 18px; align-items: start; padding-top: 4px; padding-bottom: 28px; }
main { min-width: 0; }

/* ---------- summary panels ---------- */
.pulse { display: grid; grid-template-columns: 1.32fr .92fr 1.04fr; gap: 16px; }
.panel { padding: 16px 20px 18px; min-width: 0; }
.ph { display: flex; align-items: center; gap: 14px; }
.ph .ic {
  width: 44px; height: 44px; border-radius: 50%; flex: none; display: grid; place-items: center; color: var(--blue-hi);
  background: radial-gradient(circle at 30% 30%, rgba(60, 130, 255, .38), rgba(18, 46, 104, .65));
  border: 1px solid rgba(90, 150, 255, .40); box-shadow: 0 0 16px rgba(46, 139, 255, .25);
}
.ph h2 { margin: 0; font: 600 21px/1 var(--cond); }
.total { display: flex; align-items: baseline; gap: 12px; margin: 2px 0 14px 58px; }
.total b { font: 700 50px/.9 var(--cond); }
.total span { font: 500 20px/1 var(--cond); color: var(--soft); }
.bar { display: flex; height: 10px; border-radius: 6px; overflow: hidden; background: rgba(255, 255, 255, .07); gap: 0; }
.bar i { display: block; height: 100%; transition: flex-grow .5s ease; flex-basis: 0; }
.bar .b-open { background: linear-gradient(90deg, #1FD6A0, #49F0B6); box-shadow: 0 0 10px rgba(47, 227, 154, .6); }
.bar .b-soon { background: linear-gradient(90deg, #FFB627, #FFD45A); box-shadow: 0 0 10px rgba(255, 197, 61, .5); }
.bar .b-exp { background: linear-gradient(90deg, #FF3D5E, #FF6B83); }
.bar .b-team { background: linear-gradient(90deg, #8E5BFF, #B48CFF); box-shadow: 0 0 10px rgba(165, 124, 255, .5); }
.bar .b-solo { background: linear-gradient(90deg, #2A8CFF, #4FC1FF); box-shadow: 0 0 10px rgba(58, 168, 255, .5); }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 6px; margin-top: 16px; }
.legend button {
  display: inline-flex; align-items: center; gap: 8px; border: 1px solid transparent; background: none;
  border-radius: 9px; padding: 7px 11px; cursor: pointer; color: var(--soft); font: 500 17px/1 var(--cond);
}
.legend button:hover { background: rgba(30, 70, 150, .25); }
.legend button[aria-pressed="true"] {
  background: rgba(30, 90, 200, .35); border-color: rgba(80, 150, 255, .85); color: #fff; box-shadow: 0 0 14px rgba(46, 139, 255, .35);
}
.legend button i { width: 11px; height: 11px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.legend button b { font: 700 21px/1 var(--cond); color: var(--c); }
.split { display: flex; justify-content: space-between; align-items: baseline; margin: 14px 0 14px; }
.split b { font: 700 38px/.9 var(--cond); }
.split small { color: var(--soft); font: 500 18px var(--cond); margin-left: 8px; }
.next .row1 { display: flex; align-items: center; gap: 22px; margin: 16px 0 14px; }
.next .clock { font: 700 54px/.9 var(--cond); color: var(--c, var(--text)); text-shadow: 0 0 18px color-mix(in srgb, var(--c, transparent) 45%, transparent); }
.next [data-st="open"] { --c: var(--open); } .next [data-st="soon"] { --c: var(--soon); } .next [data-st="exp"] { --c: var(--exp); }
.next .who { font: 600 19px/1.2 var(--cond); min-width: 0; }
.next .who small { display: block; color: var(--soft); font: 500 17px/1.3 var(--cond); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.next .last { display: flex; align-items: center; gap: 10px; color: var(--soft); font: 500 16.5px/1.3 var(--cond); border-top: 1px dashed rgba(120, 160, 230, .35); padding-top: 12px; }
.next .last i { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--open); box-shadow: 0 0 8px var(--open); }
.next .last b { color: var(--text); font-weight: 600; }
.next button { all: unset; cursor: pointer; display: block; border-radius: 8px; }

/* ---------- filters ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
.search {
  flex: 1 1 320px; display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 16px;
  background: var(--field); border: 1px solid var(--line); border-radius: 12px;
}
.search input { flex: 1; border: 0; background: none; outline: none; min-width: 0; font: 500 18px var(--cond); }
.search input::placeholder { color: var(--soft); opacity: .85; }
.search svg { flex: none; color: var(--soft); }
.search:focus-within { border-color: var(--blue); box-shadow: 0 0 14px rgba(46, 139, 255, .3); }
.dd { position: relative; flex: none; display: flex; height: 50px; }
.dd > svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--soft); pointer-events: none; }
.dd::after {
  content: ""; position: absolute; right: 16px; top: 50%; width: 8px; height: 8px; margin-top: -6px; pointer-events: none;
  border-right: 2px solid var(--soft); border-bottom: 2px solid var(--soft); transform: rotate(45deg);
}
.dd select {
  appearance: none; -webkit-appearance: none; height: 100%; padding: 0 42px 0 42px; cursor: pointer;
  background: var(--field); border: 1px solid var(--line); border-radius: 12px; font: 500 17px var(--cond); color: var(--text);
}
.dd select:hover { border-color: rgba(90, 150, 255, .55); }
.dd select.on { border-color: var(--blue); color: #fff; box-shadow: 0 0 12px rgba(46, 139, 255, .3); }
select option { background: #0B1834; color: var(--text); }
.quick { display: flex; align-items: center; gap: 8px; margin: 16px 0 14px; }
.quick .lbl { flex: none; color: var(--soft); font: 500 17px var(--cond); margin-right: 14px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: thin; padding: 3px 2px; min-width: 0; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 7px; cursor: pointer; border-radius: 9px; padding: 6px 13px;
  font: 700 15px/1.2 var(--cond); letter-spacing: .04em;
  color: hsl(var(--h) 88% 70%); background: hsl(var(--h) 70% 42% / .20); border: 1px solid hsl(var(--h) 70% 55% / .25);
}
.chip em { font-style: normal; font-weight: 600; color: var(--text); opacity: .9; }
.chip[aria-pressed="true"] { border-color: hsl(var(--h) 88% 66%); box-shadow: 0 0 12px hsl(var(--h) 88% 60% / .45); }
.chip.all { color: #fff; background: rgba(30, 80, 180, .25); border-color: var(--line); letter-spacing: 0; font-weight: 600; }
.chip.all[aria-pressed="true"] { background: rgba(30, 90, 200, .38); border-color: rgba(80, 150, 255, .85); box-shadow: 0 0 12px rgba(46, 139, 255, .4); }
.check { flex: none; margin-left: auto; display: inline-flex; align-items: center; gap: 8px; color: var(--soft); font: 500 15px var(--cond); cursor: pointer; white-space: nowrap; }
.check input { accent-color: var(--blue); width: 16px; height: 16px; }

/* ---------- table ---------- */
.board { overflow: hidden; }
.cols, .load {
  display: grid; gap: 12px; align-items: center;
  grid-template-columns: 128px 64px minmax(120px, 1.1fr) minmax(110px, 1fr) minmax(150px, 1.3fr) 82px 74px 86px 112px 62px 84px;
}
.cols { padding: 14px 16px; color: var(--soft); font: 500 16px var(--cond); border-bottom: 1px solid var(--line); background: rgba(14, 32, 70, .55); }
.cols .r { text-align: right; }
.cols .sort { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; border-radius: 4px; }
.cols .sort:hover, .cols .sort.on { color: #fff; }
.cols .sort svg path { fill: rgba(195, 208, 234, .45); }
.cols .sort.on.up svg .u, .cols .sort.on.dn svg .d { fill: var(--blue-hi); }
.list { list-style: none; margin: 0; padding: 0; }
.list li + li { border-top: 1px solid var(--line-soft); }
.load { position: relative; padding: 12px 16px 17px; cursor: pointer; }
.load:hover { background: rgba(30, 70, 150, .18); }
.load.is-new { animation: arrive 4s ease-out; }
@keyframes arrive { 0% { background: rgba(46, 139, 255, .28); } 100% { background: transparent; } }
.load > *, .load .grp > * { grid-row: 1; min-width: 0; }

.c-id { grid-column: 1; display: flex; align-items: center; gap: 6px; font: 700 18px/1 var(--cond); letter-spacing: .01em; }
.copy { border: 0; background: none; padding: 4px; border-radius: 6px; color: var(--soft); cursor: pointer; display: inline-flex; opacity: .7; }
.copy:hover, .load:hover .copy { opacity: 1; color: #fff; }
.c-st { grid-column: 2; }
.badge {
  display: inline-flex; align-items: center; justify-content: center; min-width: 44px; height: 32px; padding: 0 7px; border-radius: 7px;
  font: 700 17px/1 var(--cond); letter-spacing: .04em;
  color: hsl(var(--h) 88% 68%); background: hsl(var(--h) 70% 40% / .28); border: 1px solid hsl(var(--h) 70% 55% / .30);
}
.c-o { grid-column: 3; } .c-d { grid-column: 4; }
.city { font: 600 18px/1.15 var(--cond); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.city span { color: var(--soft); font-weight: 500; }
.via { display: block; color: var(--muted); font-size: 12.5px; }
.c-pu { grid-column: 5; font: 500 16px/1.25 var(--cond); }
.c-pu small { display: block; color: var(--soft); font: 500 15px/1.3 var(--cond); }
.c-mi { grid-column: 6; text-align: right; font: 600 17px/1 var(--cond); white-space: nowrap; }
.c-mi small { font: 500 14px var(--cond); color: var(--soft); }
.c-ty { grid-column: 7; }
.type {
  display: inline-block; font: 700 15px/1 var(--cond); letter-spacing: .06em; padding: 7px 10px; border-radius: 7px; border: 1px solid transparent;
}
.type.TEAM { color: #C1A3FF; background: rgba(140, 90, 255, .22); border-color: rgba(165, 124, 255, .45); }
.type.SOLO { color: #6CC4FF; background: rgba(40, 140, 255, .20); border-color: rgba(58, 168, 255, .45); }
.c-en { grid-column: 8; font: 700 24px/1 var(--cond); }
[data-st="open"] .c-en, .dr-timer[data-st="open"] .c-en { color: var(--open); text-shadow: 0 0 14px rgba(47, 227, 154, .35); }
[data-st="soon"] .c-en, .dr-timer[data-st="soon"] .c-en { color: var(--soon); text-shadow: 0 0 14px rgba(255, 197, 61, .35); }
[data-st="exp"] .c-en, .dr-timer[data-st="exp"] .c-en { color: var(--exp); text-shadow: 0 0 14px rgba(255, 77, 106, .35); }
[data-st="ended"] .c-en { color: var(--muted); font-size: 18px; }
.c-ss { grid-column: 9; }
.status { display: inline-flex; align-items: center; gap: 8px; font: 500 16.5px/1 var(--cond); white-space: nowrap; }
.status i { width: 9px; height: 9px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
[data-st="open"] .status { color: var(--open); }
[data-st="soon"] .status { color: var(--soon); }
[data-st="exp"] .status { color: var(--exp); }
[data-st="exp"] .status i { animation: blink 1s steps(2) infinite; }
[data-st="ended"] .status { color: var(--muted); }
@keyframes blink { 50% { opacity: .2; } }
.c-po { grid-column: 10; color: var(--soft); font: 500 16px var(--cond); }
.c-ac { grid-column: 11; display: flex; gap: 8px; justify-content: flex-end; }
.act {
  width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; border-radius: 9px;
  color: var(--blue-hi); border: 1px solid var(--line); background: rgba(18, 42, 92, .6);
}
.act:hover { color: #fff; border-color: var(--blue); box-shadow: 0 0 12px rgba(46, 139, 255, .35); }
.act[aria-disabled="true"] { opacity: .3; pointer-events: none; }
[data-st="ended"] .city, [data-st="ended"] .c-id, [data-st="ended"] .c-mi { color: var(--muted); }

/* fuse: savdo tugashigacha qolgan vaqt */
.fuse { position: absolute; left: 16px; right: 16px; bottom: 5px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .05); }
.fuse i { display: block; height: 100%; width: var(--w, 100%); border-radius: 3px; background: var(--open); box-shadow: 0 0 8px var(--open); transition: width 1s linear; }
[data-st="soon"] .fuse i { background: var(--soon); box-shadow: 0 0 8px var(--soon); }
[data-st="exp"] .fuse i { background: var(--exp); box-shadow: 0 0 8px var(--exp); }
[data-st="ended"] .fuse { display: none; }

.empty { padding: 60px 16px; text-align: center; color: var(--soft); }
.empty strong { display: block; color: var(--text); font: 600 22px/1.2 var(--cond); margin-bottom: 6px; }

/* ---------- Telegram network ---------- */
.net { padding: 16px; display: grid; gap: 12px; position: sticky; top: 14px; }
.net-head { display: flex; align-items: center; gap: 16px; padding: 4px 4px 2px; }
.tgbig {
  width: 62px; height: 62px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff;
  background: radial-gradient(circle at 35% 30%, #5BBBFF, #1673E6 72%); box-shadow: 0 0 26px rgba(46, 139, 255, .55);
}
.net-head h2 { margin: 0; font: 700 25px/1 var(--cond); }
.net-head p { margin: 6px 0 0; color: var(--soft); font: 500 16px/1.2 var(--cond); }
.sec { border: 1px solid var(--line-soft); background: rgba(8, 20, 46, .55); border-radius: 12px; padding: 10px 12px 6px; }
.sec-h { display: flex; align-items: center; gap: 10px; padding: 2px 0 6px; color: var(--blue-hi); }
.sec-h b { font: 700 18px var(--cond); text-transform: uppercase; color: #DCE7FF; letter-spacing: .02em; }
.sec-h small { color: var(--soft); font: 500 13px var(--font); margin-left: 6px; }
.item { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 8px 2px; }
.item + .item { border-top: 1px solid var(--line-soft); }
.ico {
  width: 46px; height: 46px; border-radius: 11px; display: grid; place-items: center; color: var(--ic, #fff);
  background: var(--ib, #1B2D55); border: 1px solid rgba(255, 255, 255, .08); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
}
.item b { display: block; font: 600 16.5px/1.15 var(--cond); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.handle {
  display: inline-block; max-width: 132px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: top;
  margin-top: 5px; padding: 3px 10px; border-radius: 7px; background: rgba(20, 40, 82, .85); border: 1px solid var(--line-soft);
  color: var(--soft); font: 500 13.5px/1.3 var(--font);
}
.handle.none { color: var(--muted); font-style: italic; }
.go {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 94px; padding: 10px 16px; border-radius: 9px;
  background: linear-gradient(180deg, #2F8EFF, #1767E8); color: #fff; font: 600 16px/1 var(--cond); text-decoration: none;
  box-shadow: 0 4px 14px rgba(23, 103, 232, .4), inset 0 1px 0 rgba(255, 255, 255, .2);
}
.go:hover { filter: brightness(1.1); }
.go.gold { background: linear-gradient(180deg, #FFD54F, #F2B01C); color: #1E1500; box-shadow: 0 4px 14px rgba(242, 176, 28, .35), inset 0 1px 0 rgba(255, 255, 255, .35); }
.go[aria-disabled="true"] { opacity: .35; pointer-events: none; box-shadow: none; }

/* ---------- drawer ---------- */
dialog { margin: 0 0 0 auto; height: 100%; max-height: 100%; width: min(460px, 100%); border: 0; border-left: 1px solid var(--line); padding: 0; background: #0A1734; color: var(--text); }
dialog::backdrop { background: rgb(2 6 18 / .65); }
dialog[open] { animation: slide .22s ease-out; }
@keyframes slide { from { transform: translateX(24px); opacity: .4; } }
.dr { display: flex; flex-direction: column; min-height: 100%; padding: calc(20px + env(safe-area-inset-top, 0px)) 22px calc(22px + env(safe-area-inset-bottom, 0px)); gap: 20px; }
.dr-head { display: flex; align-items: flex-start; gap: 12px; }
.dr-head h2 { font: 700 30px/1 var(--cond); margin: 0; }
.dr-head p { margin: 6px 0 0; color: var(--soft); font-size: 14px; }
.dr-head .x { margin-left: auto; }
.icon-btn { display: inline-flex; align-items: center; gap: 6px; background: rgba(18, 42, 92, .6); border: 1px solid var(--line); border-radius: 9px; padding: 7px 12px; cursor: pointer; font-size: 13px; color: var(--soft); }
.icon-btn:hover { color: #fff; }
.dr-timer { background: rgba(18, 42, 92, .5); border: 1px solid var(--line-soft); border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; position: relative; overflow: hidden; }
.dr-timer .c-en { font-size: 36px; }
.dr-timer .fuse { left: 0; right: 0; bottom: 0; height: 4px; border-radius: 0; }
.dr-timer p { margin: 0; color: var(--soft); font-size: 13.5px; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; margin: 0; }
.facts dt { color: var(--soft); font-size: 13px; }
.facts dd { margin: 3px 0 0; font-weight: 500; }
.stops { list-style: none; margin: 0; padding: 0; }
.stops li { position: relative; padding: 0 0 18px 30px; }
.stops li::before { content: counter(list-item); position: absolute; left: 0; top: 1px; width: 20px; height: 20px; border-radius: 50%; background: rgba(18, 42, 92, .8); border: 1px solid var(--line); font: 600 12px/18px var(--cond); text-align: center; color: var(--soft); }
.stops li:not(:last-child)::after { content: ""; position: absolute; left: 10px; top: 24px; bottom: 2px; border-left: 1px dashed var(--line); }
.stops strong { display: block; font: 600 18px/1.2 var(--cond); }
.stops span { color: var(--soft); font-size: 13.5px; }
.actions { display: grid; gap: 10px; margin-top: auto; }
.btn { display: flex; justify-content: center; align-items: center; gap: 8px; text-decoration: none; border-radius: 10px; padding: 12px 14px; font-weight: 600; cursor: pointer; background: rgba(18, 42, 92, .6); border: 1px solid var(--line); color: var(--text); }
.btn.primary { background: linear-gradient(180deg, #2F8EFF, #1767E8); border-color: transparent; color: #fff; }
.btn[aria-disabled="true"] { opacity: .45; pointer-events: none; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: #071330; padding: 10px 16px; border-radius: 10px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
.toast.on { opacity: 1; }

/* ---------- responsive ---------- */
@media (max-width: 1440px) { .hero { display: none; } .hstat { margin-left: auto; } }
@media (max-width: 1280px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .net { position: static; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); align-items: start; }
  .net-head { grid-column: 1 / -1; }
}
@media (max-width: 1180px) {
  .cols, .load { grid-template-columns: 124px 60px minmax(110px, 1fr) minmax(110px, 1fr) minmax(140px, 1.2fr) 76px 70px 80px 58px 84px; }
  .c-ss { display: none !important; }
  .c-po { grid-column: 9; } .c-ac { grid-column: 10; }
}
@media (max-width: 1000px) {
  .pulse { grid-template-columns: 1fr 1fr; } .pulse .panel:first-child { grid-column: 1 / -1; }
  .dd { flex: 1 1 160px; } .dd select { width: 100%; }
}
@media (max-width: 820px) {
  .wrap { padding: 0 16px; }
  .top .wrap { flex-wrap: wrap; gap: 12px; padding-top: 14px; padding-bottom: 6px; min-height: 0; }
  .brand { gap: 14px; }
  .mark { height: 30px; }
  .sep { height: 40px; }
  .brand h1 { font-size: 26px; }
  .brand p { font-size: 15px; margin-top: 3px; }
  .hstat { margin-left: 0; width: 100%; }
  .clockbox { flex: 1; }
  .pulse { grid-template-columns: 1fr; gap: 12px; }
  .pulse .panel:first-child { grid-column: auto; }
  .panel { padding: 14px 16px; }
  .total { margin-left: 0; margin-top: 12px; }
  .total b { font-size: 42px; }
  .search { flex-basis: 100%; }
  .quick .lbl { display: none; }
  .check { margin-left: 0; }
  .quick { flex-wrap: wrap; }
  .chips { flex: 1 1 100%; order: -1; }
  .cols { display: none; }
  .load {
    grid-template-columns: auto auto 1fr auto;
    grid-template-areas: "id st . en" "o o o o" "d d d d" "pu pu pu pu" "mi ty ac ac";
    gap: 6px 10px; padding: 14px 14px 18px;
  }
  .load > *, .load .grp > * { grid-row: auto; grid-column: auto; }
  .c-id { grid-area: id; } .c-st { grid-area: st; } .c-en { grid-area: en; text-align: right; }
  .c-o { grid-area: o; } .c-d { grid-area: d; } .c-pu { grid-area: pu; }
  .c-mi { grid-area: mi; text-align: left; } .c-ty { grid-area: ty; } .c-ac { grid-area: ac; }
  .c-o::before, .c-d::before { color: var(--muted); font: 500 13px/20px var(--font); margin-right: 6px; float: left; width: 36px; }
  .c-o::before { content: "From"; } .c-d::before { content: "To"; }
  .c-ss, .c-po { display: none !important; }
  .fuse { left: 14px; right: 14px; }
  .net { grid-template-columns: 1fr; padding: 12px; }
}
@media (max-width: 420px) { .clockbox small { display: none; } .livebox { padding: 8px 12px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

      </div>
      <div class="total"><b id="tTotal">0</b><span id="tTotalLbl">loads open for bidding</span></div>
      <div class="bar" id="statusBar"><i class="b-open"></i><i class="b-soon"></i><i class="b-exp"></i></div>
      <div class="legend" id="statusSeg" role="group" aria-label="Filter by status">
        <button data-v="all" aria-pressed="true" style="--c:#fff">All <b data-c="all">0</b></button>
        <button data-v="open" aria-pressed="false" style="--c:var(--open)"><i></i>Open <b data-c="open">0</b></button>
        <button data-v="soon" aria-pressed="false" style="--c:var(--soon)"><i></i>Ending soon <b data-c="soon">0</b></button>
        <button data-v="exp" aria-pressed="false" style="--c:var(--exp)"><i></i>Expiring <b data-c="exp">0</b></button>
      </div>
    </div>
    <div class="panel card">
      <div class="ph">
        <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>
        <h2>Driver type</h2>
      </div>
      <div class="split">
        <div><b style="color:var(--team)" data-c="TEAM">0</b><small>Team</small></div>
        <div><b style="color:var(--solo)" data-c="SOLO">0</b></div>
      </div>
      <div class="bar" id="typeBar"><i class="b-team"></i><i class="b-solo"></i></div>
      <div class="legend" id="typeSeg" role="group" aria-label="Filter by driver type">
        <button data-v="all" aria-pressed="true" style="--c:#fff">Any driver</button>
        <button data-v="TEAM" aria-pressed="false" style="--c:var(--team)"><i></i>Team</button>
        <button data-v="SOLO" aria-pressed="false" style="--c:var(--solo)"><i></i>Solo</button>
      </div>
    </div>
    <div class="panel card next" id="nextPanel">
      <div class="ph">
        <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
        <h2>Closing next</h2>
      </div>
      <div id="nextBody"></div>
      <div class="last" id="lastPosted"><i></i><span>Waiting for the first load</span></div>
    </div>
  </section>

  <section class="filters" aria-label="Filters">
    <label class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search load number, city, state or ZIP..." autocomplete="off">
    </label>
    <label class="dd"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12Z"/><circle cx="12" cy="9" r="2.5"/></svg><select id="origin" aria-label="Origin state"></select></label>
    <label class="dd"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12Z"/><circle cx="12" cy="9" r="2.5"/></svg><select id="dest" aria-label="Destination state"></select></label>
    <label class="dd"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><select id="driver" aria-label="Driver type">
      <option value="all">Any driver</option><option value="TEAM">Team</option><option value="SOLO">Solo</option>
    </select></label>
    <label class="dd"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg><select id="sort" aria-label="Sort">
      <option value="new">Newest first</option><option value="old">Oldest first</option>
      <option value="ends">Ending soonest</option><option value="endsDesc">Ending latest</option>
      <option value="pickup">Earliest pickup</option><option value="pickupDesc">Latest pickup</option>
      <option value="milesDesc">Longest miles</option><option value="milesAsc">Shortest miles</option>
      <option value="state">State A–Z</option><option value="stateDesc">State Z–A</option>
      <option value="team">Team first</option><option value="solo">Solo first</option>
    </select></label>
  </section>
  <div class="quick">
    <span class="lbl">Quick filter:</span>
    <div class="chips" id="states" role="group" aria-label="Origin state"></div>
    <label class="check"><input type="checkbox" id="showExpired"> Show ended</label>
  </div>

  <section class="board card" aria-label="Loads">
    <div class="cols">
      <span>Load</span>
      <button class="sort" data-sort="state">State <svg width="10" height="14" viewBox="0 0 10 14" aria-hidden="true"><path class="u" d="M5 1 9 6H1z"/><path class="d" d="M5 13 1 8h8z"/></svg></button>
      <span>Origin</span><span>Destination</span>
      <button class="sort" data-sort="pickup">Pickup <svg width="10" height="14" viewBox="0 0 10 14" aria-hidden="true"><path class="u" d="M5 1 9 6H1z"/><path class="d" d="M5 13 1 8h8z"/></svg></button>
      <button class="sort" data-sort="miles" style="justify-self:end">Miles <svg width="10" height="14" viewBox="0 0 10 14" aria-hidden="true"><path class="u" d="M5 1 9 6H1z"/><path class="d" d="M5 13 1 8h8z"/></svg></button>
      <button class="sort" data-sort="type">Type <svg width="10" height="14" viewBox="0 0 10 14" aria-hidden="true"><path class="u" d="M5 1 9 6H1z"/><path class="d" d="M5 13 1 8h8z"/></svg></button>
      <button class="sort" data-sort="ends">Ends in <svg width="10" height="14" viewBox="0 0 10 14" aria-hidden="true"><path class="u" d="M5 1 9 6H1z"/><path class="d" d="M5 13 1 8h8z"/></svg></button>
      <span class="c-ss">Status</span><span style="white-space:nowrap">Posted ET</span><span></span>
    </div>
    <ul class="list" id="list"></ul>
    <div class="empty" id="empty" hidden></div>
  </section>
</main>

<aside class="net card" id="net" aria-label="Telegram network" hidden></aside>
</div>

<dialog id="drawer" aria-labelledby="drTitle"><div class="dr" id="dr"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const store = {
    get(k, d) { try { const v = localStorage.getItem("hub:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("hub:" + k, JSON.stringify(v)); } catch {} },
  };

  let TTL = 30 * 60e3, clockSkew = 0, unseen = 0, openId = null;
  const loads = new Map(), fresh = new Set();
  const SORTS = ["new", "old", "ends", "endsDesc", "pickup", "pickupDesc", "milesDesc", "milesAsc", "state", "stateDesc", "team", "solo"];
  const f = {
    status: store.get("status2", "all"), type: store.get("type", "all"), dest: store.get("dest", "all"),
    states: new Set(store.get("states", [])), q: "", sort: store.get("sort", "new"),
    expired: store.get("expired", false), sound: store.get("sound", false),
  };
  if (!["all", "open", "soon", "exp"].includes(f.status)) f.status = "all";
  if (!["all", "TEAM", "SOLO"].includes(f.type)) f.type = "all";
  if (!SORTS.includes(f.sort)) f.sort = "new";

  // ---------- helpers ----------
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const now = () => Date.now() + clockSkew;
  const title = s => s.toLowerCase().replace(/\b([a-z])/g, m => m.toUpperCase());
  const TZ = {};
  "CT DE DC FL GA IN KY ME MD MA MI NH NJ NY NC OH PA RI SC VT VA WV".split(" ").forEach(s => TZ[s] = "ET");
  "AL AR IL IA KS LA MN MS MO NE ND OK SD TN TX WI".split(" ").forEach(s => TZ[s] = "CT");
  "AZ CO ID MT NM UT WY".split(" ").forEach(s => TZ[s] = "MT");
  "CA NV OR WA".split(" ").forEach(s => TZ[s] = "PT");
  TZ.AK = "AKT"; TZ.HI = "HT";
  const hue = st => { let h = 0; for (const c of String(st)) h = (h * 31 + c.charCodeAt(0)) % 360; return (h * 7 + 40) % 360; };
  const ET = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour: "2-digit", minute: "2-digit", hour12: false });
  const ET12 = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit" });
  const ETD = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", weekday: "short", month: "short", day: "numeric", year: "numeric" });

  function place(stop) {
    const m = String(stop || "").match(/^(.*?),\s*([A-Z]{2})\s*(\d{5})?/);
    return m ? { city: title(m[1]), st: m[2], zip: m[3] || "" } : { city: title(stop || "—"), st: "", zip: "" };
  }
  const first = l => place((l.stops || [])[0]);
  const lastStop = l => { const s = l.stops || []; return place(s[s.length - 1]); };
  const origSt = l => l.state_code || first(l).st;
  const destSt = l => lastStop(l).st;
  function parseUS(s) {
    const m = String(s || "").match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{1,2}):(\d{2})\s*(AM|PM)/i);
    if (!m) return null;
    let h = +m[4] % 12; if (/pm/i.test(m[6])) h += 12;
    return { mo: +m[1], d: +m[2], h, mi: +m[5], key: Date.UTC(+m[3], +m[1] - 1, +m[2], h, +m[5]) };
  }
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function fmtUS(s, tz) {
    const p = parseUS(s); if (!p) return esc(s || "—");
    return `${MON[p.mo - 1]} ${p.d}, ${p.h % 12 || 12}:${String(p.mi).padStart(2, "0")} ${p.h < 12 ? "AM" : "PM"}${tz ? " " + tz : ""}`;
  }
  const miles = l => parseFloat(String(l.distance || "").replace(/[^\d.]/g, "")) || 0;
  const created = l => Date.parse(l.created_at);
  const left = l => created(l) + TTL - now();
  function status(l) {
    const ms = left(l);
    if (ms <= 0) return "ended";
    if (ms <= 5 * 60e3) return "exp";
    if (ms <= 15 * 60e3) return "soon";
    return "open";
  }
  const LABEL = { open: "Open", soon: "Ending soon", exp: "Expiring", ended: "Ended" };
  const SIG = { open: "o", soon: "s", exp: "x", ended: "d" };
  function clock(ms) {
    if (ms <= 0) return "Ended";
    const s = Math.floor(ms / 1000);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  }
  const fuseW = l => Math.max(0, Math.min(100, left(l) / TTL * 100)).toFixed(2) + "%";
  const postedET = l => ET.format(new Date(created(l)));
  function ago(ms) {
    const m = Math.round(ms / 60e3);
    return m < 1 ? "just now" : m < 60 ? `${m} min ago` : `${Math.floor(m / 60)} h ${m % 60} min ago`;
  }
  const svg = (d, w = 18) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const I = {
    copy: svg('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>', 16),
    map: svg('<path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12Z"/><circle cx="12" cy="9" r="2.5"/>'),
    tg: svg('<path d="m22 3-9.5 18-2.5-8-8-2.5L22 3Z"/><path d="m10 13 5-5"/>'),
  };

  // ---------- filtering ----------
  function matches(l, ignore) {
    const st = status(l);
    if (!f.expired && st === "ended") return false;
    if (ignore !== "status" && f.status !== "all" && st !== f.status) return false;
    if (ignore !== "type" && f.type !== "all" && l.load_type !== f.type) return false;
    if (ignore !== "state" && f.states.size && !f.states.has(origSt(l))) return false;
    if (ignore !== "dest" && f.dest !== "all" && destSt(l) !== f.dest) return false;
    if (f.q) {
      const hay = [l.order_id, l.state_code, ...(l.stops || []), ...(l.stop_addresses || [])].join(" ").toLowerCase();
      if (!f.q.split(/\s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  }
  const pk = (l, miss) => parseUS(l.pickup_time)?.key ?? miss;
  const newest = (a, b) => created(b) - created(a);
  const BY = {
    new: newest,
    old: (a, b) => created(a) - created(b),
    ends: (a, b) => left(a) - left(b),
    endsDesc: (a, b) => left(b) - left(a),
    pickup: (a, b) => pk(a, 9e15) - pk(b, 9e15),
    pickupDesc: (a, b) => pk(b, -1) - pk(a, -1),
    milesDesc: (a, b) => miles(b) - miles(a),
    milesAsc: (a, b) => miles(a) - miles(b),
    state: (a, b) => origSt(a).localeCompare(origSt(b)) || newest(a, b),
    stateDesc: (a, b) => origSt(b).localeCompare(origSt(a)) || newest(a, b),
    team: (a, b) => (a.load_type === "TEAM" ? 0 : 1) - (b.load_type === "TEAM" ? 0 : 1) || newest(a, b),
    solo: (a, b) => (a.load_type === "SOLO" ? 0 : 1) - (b.load_type === "SOLO" ? 0 : 1) || newest(a, b),
  };
  const sorted = arr => arr.sort(BY[f.sort] || newest);
  // ustun sarlavhasi bosilganda: birinchi bosish -> [0], qayta bosish -> [1]
  const COLSORT = { state: ["state", "stateDesc"], pickup: ["pickup", "pickupDesc"], miles: ["milesDesc", "milesAsc"], type: ["team", "solo"], ends: ["ends", "endsDesc"] };
  const DESC = new Set(["stateDesc", "pickupDesc", "milesDesc", "endsDesc", "solo"]);

  // ---------- rendering ----------
  function cityHTML(p) { return `<span class="city">${esc(p.city)}${p.st ? `<span>, ${esc(p.st)}</span>` : ""}</span>`; }
  function rowHTML(l) {
    const stops = l.stops || [];
    const o = first(l), d = lastStop(l);
    const extra = stops.length - 2, st = status(l), sc = origSt(l);
    return `<li><div class="load${fresh.has(l.order_id) ? " is-new" : ""}" role="button" tabindex="0" data-id="${esc(l.order_id)}" data-st="${st}" style="--w:${fuseW(l)}" aria-label="Load ${esc(l.order_id)}, ${esc(o.city)} to ${esc(d.city)}">
      <span class="c-id">#${esc(l.order_id)}<button class="copy" data-copy="${esc(l.order_id)}" aria-label="Copy load number" title="Copy load number">${I.copy}</button></span>
      <span class="c-st"><span class="badge" style="--h:${hue(sc)}">${esc(sc || "—")}</span></span>
      <span class="c-o">${cityHTML(o)}</span>
      <span class="c-d">${cityHTML(d)}${extra > 0 ? `<span class="via">+${extra} stop${extra > 1 ? "s" : ""} before</span>` : ""}</span>
      <span class="c-pu">${fmtUS(l.pickup_time, TZ[o.st])}<small>Del ${fmtUS(l.delivery_time, TZ[d.st])}</small></span>
      <span class="c-mi">${miles(l).toLocaleString("en-US", { maximumFractionDigits: 1 })}<small> mi</small></span>
      <span class="c-ty"><span class="type ${esc(l.load_type)}">${esc(l.load_type || "—")}</span></span>
      <span class="c-en" data-ends>${clock(left(l))}</span>
      <span class="c-ss"><span class="status"><i></i><span data-lbl>${LABEL[st]}</span></span></span>
      <span class="c-po">${postedET(l)}</span>
      <span class="c-ac">
        <a class="act" href="${esc(l.route_url || "#")}" target="_blank" rel="noopener" title="Open route in Google Maps" aria-label="Open route in Google Maps" ${l.route_url ? "" : 'aria-disabled="true"'}>${I.map}</a>
        <a class="act" href="${esc(l.tg_url || "#")}" target="_blank" rel="noopener" title="${l.tg_url ? "Open Telegram post" : "Not posted to Telegram"}" aria-label="Open Telegram post" ${l.tg_url ? "" : 'aria-disabled="true"'}>${I.tg}</a>
      </span>
      <span class="fuse"><i style="width:var(--w)"></i></span>
    </div></li>`;
  }

  // innerHTML faqat o'zgarganda yoziladi — ochiq select yopilib qolmasin
  function setHTML(el, html) { if (el._html !== html) { el._html = html; el.innerHTML = html; } }

  function renderSummary() {
    const c = { all: 0, open: 0, soon: 0, exp: 0, TEAM: 0, SOLO: 0 };
    let next = null, last = null;
    for (const l of loads.values()) {
      const st = status(l);
      if (!last || created(l) > created(last)) last = l;
      if (st === "ended") continue;
      if (matches(l, "status")) { c.all++; c[st]++; if (!next || left(l) < left(next)) next = l; }
      if (matches(l, "type")) c[l.load_type] = (c[l.load_type] || 0) + 1;
    }
    document.querySelectorAll("[data-c]").forEach(b => b.textContent = c[b.dataset.c] || 0);
    $("#tTotal").textContent = c.all;
    $("#tTotalLbl").textContent = c.all === 1 ? "load open for bidding" : "loads open for bidding";
    const sb = $("#statusBar").children;
    [c.open, c.soon, c.exp].forEach((v, i) => sb[i].style.flexGrow = v);
    const tb = $("#typeBar").children;
    [c.TEAM || 0, c.SOLO || 0].forEach((v, i) => tb[i].style.flexGrow = v);

    if (next) {
      const o = first(next), d = lastStop(next);
      setHTML($("#nextBody"), `<button data-open="${esc(next.order_id)}" aria-label="Open load ${esc(next.order_id)}"><div class="row1" data-st="${status(next)}">
        <span class="clock" id="nextClock">${clock(left(next))}</span>
        <span class="who">#${esc(next.order_id)}<small>${esc(o.city)}, ${esc(o.st)} → ${esc(d.city)}, ${esc(d.st)}</small></span>
      </div></button>`);
      $("#nextBody").dataset.id = next.order_id;
    } else {
      setHTML($("#nextBody"), `<div class="row1"><span class="clock" style="color:var(--muted)">–:––</span><span class="who"><small>No open loads</small></span></div>`);
      $("#nextBody").dataset.id = "";
    }
    $("#lastPosted span").innerHTML = last ? `Last load posted <b>${ago(now() - created(last))}</b> at ${ET12.format(new Date(created(last)))} ET` : "Waiting for the first load";

    // origin shtatlari: quick filter chiplari + dropdown
    const per = {};
    for (const l of loads.values()) { const s = origSt(l); if (s && matches(l, "state")) per[s] = (per[s] || 0) + 1; }
    f.states.forEach(s => per[s] ??= 0);
    const keys = Object.keys(per).sort();
    setHTML($("#states"), `<button class="chip all" data-s="" aria-pressed="${!f.states.size}">All States</button>` + keys.map(s =>
      `<button class="chip" style="--h:${hue(s)}" data-s="${esc(s)}" aria-pressed="${f.states.has(s)}">${esc(s)} <em>${per[s]}</em></button>`
    ).join(""));
    const osel = $("#origin");
    setHTML(osel, `<option value="">Origin state</option>` +
      (f.states.size > 1 ? `<option value="__multi">${f.states.size} states</option>` : "") +
      keys.map(s => `<option value="${esc(s)}">${esc(s)} (${per[s]})</option>`).join(""));
    osel.value = f.states.size > 1 ? "__multi" : f.states.size ? [...f.states][0] : "";
    osel.classList.toggle("on", f.states.size > 0);

    // destination shtatlari
    const dper = {};
    for (const l of loads.values()) { const s = destSt(l); if (s && matches(l, "dest")) dper[s] = (dper[s] || 0) + 1; }
    if (f.dest !== "all") dper[f.dest] ??= 0;
    const dsel = $("#dest");
    setHTML(dsel, `<option value="all">Any destination</option>` +
      Object.keys(dper).sort().map(s => `<option value="${esc(s)}">${esc(s)} (${dper[s]})</option>`).join(""));
    dsel.value = f.dest; dsel.classList.toggle("on", f.dest !== "all");
  }

  function syncControls() {
    for (const [id, key] of [["#statusSeg", "status"], ["#typeSeg", "type"]])
      $(id).querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === f[key]));
    $("#driver").value = f.type; $("#driver").classList.toggle("on", f.type !== "all");
    $("#sort").value = f.sort;
    document.querySelectorAll(".cols .sort").forEach(b => {
      const on = COLSORT[b.dataset.sort].includes(f.sort);
      b.classList.toggle("on", on); b.classList.toggle("dn", on && DESC.has(f.sort)); b.classList.toggle("up", on && !DESC.has(f.sort));
    });
  }

  function render() {
    const list = sorted([...loads.values()].filter(l => matches(l)));
    $("#list").innerHTML = list.map(rowHTML).join("");
    renderSummary(); syncControls();
    const empty = $("#empty");
    if (list.length) { empty.hidden = true; return; }
    empty.hidden = false;
    const filtered = f.status !== "all" || f.type !== "all" || f.dest !== "all" || f.states.size || f.q;
    empty.innerHTML = filtered
      ? `<strong>No loads match these filters</strong>Loosen a filter to see more of the board.<br><br><button class="btn" id="reset" style="display:inline-flex">Reset filters</button>`
      : `<strong>No open loads right now</strong>New loads appear here the moment they post.${f.expired ? "" : `<br><br><button class="btn" id="showEnded" style="display:inline-flex">Show ended loads</button>`}`;
  }

  let lastSig = "";
  function tick() {
    document.querySelectorAll(".load[data-id]").forEach(el => {
      const l = loads.get(el.dataset.id); if (!l) return;
      const st = status(l);
      if (el.dataset.st !== st) { el.dataset.st = st; const lb = el.querySelector("[data-lbl]"); if (lb) lb.textContent = LABEL[st]; }
      el.style.setProperty("--w", fuseW(l));
      el.querySelector("[data-ends]").textContent = clock(left(l));
    });
    const nid = $("#nextBody").dataset.id;
    if (nid && loads.has(nid)) { const n = loads.get(nid); $("#nextClock").textContent = clock(left(n)); $("#nextBody .row1").dataset.st = status(n); }
    const t = new Date(now());
    $("#etclock").firstChild.nodeValue = ET.format(t);
    $("#etdate").textContent = ETD.format(t);
    const sig = [...loads.values()].map(l => SIG[status(l)]).join("");   // exp va ended ikkalasi "e" bilan boshlanadi
    if (sig !== lastSig) { lastSig = sig; render(); }
    else if (t.getSeconds() === 0) renderSummary();   // "posted x min ago" yangilansin
    if (openId && loads.has(openId)) updateDrawerTimer();
  }

  // ---------- drawer ----------
  function openDrawer(id) {
    const l = loads.get(id); if (!l) return;
    openId = id;
    const stops = l.stops || [], addr = l.stop_addresses || [];
    const o = first(l), d = lastStop(l);
    const link = `${location.origin}/board?load=${encodeURIComponent(id)}`;
    $("#dr").innerHTML = `
      <div class="dr-head">
        <div><h2 id="drTitle">#${esc(id)}</h2><p>${esc(o.city)}, ${esc(o.st)} → ${esc(d.city)}, ${esc(d.st)}</p></div>
        <button class="icon-btn x" data-close>Close</button>
      </div>
      <div class="dr-timer" data-st="${status(l)}" style="--w:${fuseW(l)}">
        <span class="c-en" id="drEnds">${clock(left(l))}</span>
        <p id="drNote"></p>
        <span class="fuse"><i style="width:var(--w)"></i></span>
      </div>
      <dl class="facts">
        <div><dt>Distance</dt><dd>${miles(l).toLocaleString("en-US")} miles</dd></div>
        <div><dt>Driver</dt><dd><span class="type ${esc(l.load_type)}">${esc(l.load_type || "—")}</span></dd></div>
        <div><dt>Pickup</dt><dd>${fmtUS(l.pickup_time, TZ[o.st])}</dd></div>
        <div><dt>Delivery</dt><dd>${fmtUS(l.delivery_time, TZ[d.st])}</dd></div>
        <div><dt>Posted</dt><dd>${ET12.format(new Date(created(l)))} ET</dd></div>
        <div><dt>Bidding ends</dt><dd>${ET12.format(new Date(created(l) + TTL))} ET</dd></div>
      </dl>
      <ol class="stops">${stops.map((s, i) => {
        const p = place(s);
        return `<li><strong>${esc(p.city)}, ${esc(p.st)} ${esc(p.zip)}</strong><span>${esc(addr[i] || "")}</span></li>`;
      }).join("")}</ol>
      <div class="actions">
        <a class="btn primary" href="${esc(l.route_url || "#")}" target="_blank" rel="noopener" ${l.route_url ? "" : 'aria-disabled="true"'}>Open route in Google Maps</a>
        <a class="btn" href="${esc(l.tg_url || "#")}" target="_blank" rel="noopener" ${l.tg_url ? "" : 'aria-disabled="true"'}>${l.tg_url ? "Open Telegram post" : "Not posted to Telegram"}</a>
        <button class="btn" data-copy="${esc(id)}">Copy load number</button>
        <button class="btn" data-copy="${esc(link)}" data-msg="Board link copied">Copy board link</button>
      </div>`;
    updateDrawerTimer();
    const dlg = $("#drawer");
    if (!dlg.open) dlg.showModal();
    const u = new URL(location); u.searchParams.set("load", id); history.replaceState(null, "", u);
  }
  function updateDrawerTimer() {
    const l = loads.get(openId), box = $(".dr-timer"); if (!l || !box) return;
    const st = status(l);
    box.dataset.st = st; box.style.setProperty("--w", fuseW(l));
    $("#drEnds").textContent = clock(left(l));
    $("#drNote").textContent = st === "ended" ? "Bidding closed" : `left to bid, ${LABEL[st].toLowerCase()}`;
  }
  $("#drawer").addEventListener("close", () => {
    openId = null;
    const u = new URL(location); u.searchParams.delete("load"); history.replaceState(null, "", u);
  });
  $("#drawer").addEventListener("click", e => {
    if (e.target === e.currentTarget || e.target.closest("[data-close]")) $("#drawer").close();
  });

  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.classList.add("on");
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 1800);
  }
  async function copy(text, msg) {
    try { await navigator.clipboard.writeText(text); toast(msg); }
    catch { toast("Copy failed. Select the text and copy it manually."); }
  }
  document.addEventListener("click", e => {
    const c = e.target.closest("[data-copy]");
    if (c) { e.stopPropagation(); copy(c.dataset.copy, c.dataset.msg || `#${c.dataset.copy} copied`); }
  }, true);

  // ---------- Telegram network (static/network.json) ----------
  const NI = {
    megaphone: svg('<path d="M3 11v2a1 1 0 0 0 1 1h3l6 4V6L7 10H4a1 1 0 0 0-1 1Z"/><path d="M17 8a5 5 0 0 1 0 8"/>', 22),
    users: svg('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/>', 22),
    headset: svg('<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>', 22),
  };
  const IC = {
    usps:     ["#123C9E", "#FFFFFF", svg('<path d="M3 7h11l-3 4h9l-8 7 2-5H5Z" fill="currentColor" stroke="none"/>', 24)],
    dispatch: ["#0F6B4F", "#5BF2B8", svg('<path d="M12 3a8 8 0 1 1-6.9 12L3 21l6-2.1A8 8 0 0 1 12 3Z"/><path d="M10 9.5a2 2 0 1 1 3 1.7c-.7.4-1 .9-1 1.8M12 16h.01"/>', 24)],
    checkin:  ["#22335E", "#B9CBF5", svg('<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v3h6V3M9 12l2 2 4-4M9 17h6"/>', 24)],
    vacancy:  ["#4A2A8F", "#D5B8FF", svg('<rect x="4" y="9" width="7" height="12" rx="1"/><rect x="13" y="4" width="7" height="17" rx="1"/><path d="M7 13h1M7 17h1M16 8h1M16 12h1M16 16h1"/>', 24)],
    amazon:   ["#1E2433", "#FFFFFF", `<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><text x="12" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="15" fill="#fff">a</text><path d="M5 17.5c4 2.5 10 2.5 14 0" fill="none" stroke="#FF9F1C" stroke-width="2" stroke-linecap="round"/><path d="m17 16 2.2 1.4-1 2.3" fill="none" stroke="#FF9F1C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`],
    truck:    ["#6B4A0E", "#FFC53D", svg('<path d="M2 7h11v9H2zM13 10h4l3 3v3h-7z"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>', 24)],
    recruit:  ["#4A2A8F", "#D5B8FF", svg('<circle cx="12" cy="7" r="3"/><circle cx="5" cy="10" r="2.2"/><circle cx="19" cy="10" r="2.2"/><path d="M6.5 20a5.5 5.5 0 0 1 11 0M1.5 19a3.5 3.5 0 0 1 4-3.4M22.5 19a3.5 3.5 0 0 0-4-3.4"/>', 24)],
    chat:     ["#0F6B4F", "#5BF2B8", svg('<path d="M4 5h16v11H9l-5 4Z"/><path d="M8 9h8M8 12h5"/>', 24)],
    support:  ["#3B3A12", "#FFD54F", svg('<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>', 24)],
  };
  const TG = svg('<path d="m22 3-9.5 18-2.5-8-8-2.5L22 3Z" fill="currentColor"/>', 16);
  const MSG = svg('<path d="M4 5h16v11H9l-5 4Z"/>', 16);
  async function loadNetwork() {
    let n;
    try { n = await (await fetch("/static/network.json", { cache: "no-cache" })).json(); } catch { return; }
    const items = (sec) => (sec.items || []).map(it => {
      const handle = String(it.handle || "").replace(/^@/, "");
      const url = it.url || (handle ? `https://t.me/${encodeURIComponent(handle)}` : "");
      const [bg, fg, icon] = IC[it.icon] || IC.chat;
      return `<div class="item">
        <span class="ico" style="--ib:${bg};--ic:${fg}">${icon}</span>
        <div style="min-width:0"><b>${esc(it.name)}</b>${handle ? `<span class="handle" title="@${esc(handle)}">@${esc(handle)}</span>` : `<span class="handle none">link not set</span>`}</div>
        <a class="go${sec.style === "gold" ? " gold" : ""}" href="${esc(url || "#")}" target="_blank" rel="noopener" ${url ? "" : 'aria-disabled="true"'}>${sec.style === "gold" ? MSG : TG}${esc(sec.action || "Open")}</a>
      </div>`;
    }).join("");
    const net = $("#net");
    net.innerHTML = `<div class="net-head"><span class="tgbig">${svg('<path d="m22 3-9.5 18-2.5-8-8-2.5L22 3Z" fill="currentColor"/><path d="m10 13 5-5" stroke="#1673E6"/>', 30)}</span>
        <div><h2>${esc(n.title || "Telegram Network")}</h2>${n.subtitle ? `<p>${esc(n.subtitle)}</p>` : ""}</div></div>` +
      (n.sections || []).map(sec => `<section class="sec">
        <div class="sec-h">${NI[sec.icon] || NI.megaphone}<b>${esc(sec.title)}</b>${sec.note ? `<small>${esc(sec.note)}</small>` : ""}</div>
        ${items(sec)}
      </section>`).join("");
    net.hidden = false;
  }

  // ---------- sound + title ----------
  let audio;
  function beep() {
    if (!f.sound) return;
    try {
      audio ??= new (window.AudioContext || window.webkitAudioContext)();
      const t = audio.currentTime;
      [880, 1175].forEach((hz, i) => {
        const o = audio.createOscillator(), g = audio.createGain();
        o.type = "sine"; o.frequency.value = hz;
        g.gain.setValueAtTime(0.0001, t + i * .12);
        g.gain.exponentialRampToValueAtTime(0.22, t + i * .12 + .02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + i * .12 + .3);
        o.connect(g).connect(audio.destination); o.start(t + i * .12); o.stop(t + i * .12 + .32);
      });
    } catch {}
  }
  function setTitle() { document.title = (unseen ? `(${unseen}) ` : "") + "USPS Live Hub · HUB Logistics"; }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { unseen = 0; setTitle(); } });

  // ---------- data ----------
  function setConn(s, text, sub) { const c = $("#conn"); c.dataset.s = s; $("b", c).textContent = text; $("small", c).textContent = sub; }
  let sourceOnline = true, socketOpen = false;
  function updateConn() {
    if (!socketOpen) setConn("warn", "Reconnecting", "Reaching the server");
    else if (!sourceOnline) setConn("warn", "Source offline", "Waiting for usps.uz");
    else setConn("live", "Live", "Real-time loads");
  }
  async function loadAll() {
    const r = await fetch("/api/loads", { cache: "no-store" });
    const data = await r.json();
    TTL = (data.ttl_min || 30) * 60e3;
    clockSkew = Date.parse(data.server_time) - Date.now();
    sourceOnline = data.source_online;
    loads.clear();
    data.loads.forEach(l => loads.set(l.order_id, l));
    render(); updateConn();
  }
  function addLoad(l) {
    const isNew = !loads.has(l.order_id);
    loads.set(l.order_id, l);
    if (isNew) {
      fresh.add(l.order_id); setTimeout(() => fresh.delete(l.order_id), 4000);
      if (matches(l)) { beep(); if (document.hidden) { unseen++; setTitle(); } }
    }
    render();
    if (openId === l.order_id) openDrawer(openId);
  }
  let retry = 1000;
  function connect() {
    const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
    let ping;
    ws.onopen = async () => {
      socketOpen = true; retry = 1000;
      ping = setInterval(() => ws.readyState === 1 && ws.send("ping"), 25000);
      try { await loadAll(); } catch {}
    };
    ws.onmessage = e => {
      let m; try { m = JSON.parse(e.data); } catch { return; }
      if (m.type === "load" && m.load) addLoad(m.load);
      if (m.type === "source") { sourceOnline = m.online; updateConn(); }
    };
    ws.onclose = () => {
      socketOpen = false; clearInterval(ping); updateConn();
      setTimeout(connect, retry); retry = Math.min(retry * 2, 20000);
    };
  }

  // ---------- controls ----------
  function setType(v) { f.type = v; store.set("type", v); render(); }
  function setSort(v) { f.sort = v; store.set("sort", v); render(); }
  function setStates(arr) { f.states = new Set(arr); store.set("states", [...f.states]); render(); }
  $("#statusSeg").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    f.status = b.dataset.v; store.set("status2", f.status); render();
  });
  $("#typeSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setType(b.dataset.v); });
  $("#driver").addEventListener("change", e => setType(e.target.value));
  $("#states").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const s = b.dataset.s;
    if (!s) return setStates([]);
    f.states.has(s) ? f.states.delete(s) : f.states.add(s);
    setStates([...f.states]);
  });
  $("#origin").addEventListener("change", e => { const v = e.target.value; if (v !== "__multi") setStates(v ? [v] : []); });
  $("#dest").addEventListener("change", e => { f.dest = e.target.value; store.set("dest", f.dest); render(); });
  $("#sort").addEventListener("change", e => setSort(e.target.value));
  document.querySelector(".cols").addEventListener("click", e => {
    const b = e.target.closest(".sort"); if (!b) return;
    const pair = COLSORT[b.dataset.sort];
    setSort(f.sort === pair[0] ? pair[1] : pair[0]);
  });
  let qt; $("#q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { f.q = e.target.value.trim().toLowerCase(); render(); }, 120); });
  $("#showExpired").checked = f.expired;
  $("#showExpired").addEventListener("change", e => { f.expired = e.target.checked; store.set("expired", f.expired); render(); });
  const snd = $("#sound"); snd.setAttribute("aria-pressed", f.sound);
  snd.addEventListener("click", () => {
    f.sound = !f.sound; store.set("sound", f.sound); snd.setAttribute("aria-pressed", f.sound);
    if (f.sound) { beep(); toast("Sound on for new loads"); } else toast("Sound off");
  });
  $("#list").addEventListener("click", e => {
    if (e.target.closest("a, button")) return;
    const r = e.target.closest(".load"); if (r) openDrawer(r.dataset.id);
  });
  $("#list").addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("load")) { e.preventDefault(); openDrawer(e.target.dataset.id); }
  });
  $("#nextPanel").addEventListener("click", e => { const b = e.target.closest("[data-open]"); if (b) openDrawer(b.dataset.open); });
  $("#empty").addEventListener("click", e => {
    if (e.target.id === "showEnded") { f.expired = true; $("#showExpired").checked = true; store.set("expired", true); render(); }
    if (e.target.id === "reset") {
      f.status = "all"; f.type = "all"; f.dest = "all"; f.states.clear(); f.q = ""; $("#q").value = "";
      store.set("status2", "all"); store.set("type", "all"); store.set("dest", "all"); store.set("states", []);
      render();
    }
  });

  // ---------- start ----------
  (async () => {
    render();
    loadNetwork();
    try { await loadAll(); } catch { setConn("warn", "Server unreachable", "Retrying"); }
    const want = new URLSearchParams(location.search).get("load");
    if (want) {
      if (!loads.has(want)) {
        try {
          const r = await fetch("/api/loads?hours=168", { cache: "no-store" });
          const old = (await r.json()).loads.find(l => l.order_id === want);
          if (old) loads.set(old.order_id, old);
        } catch {}
      }
      loads.has(want) ? openDrawer(want) : toast(`Load #${want} is no longer on the board`);
    }
    connect();
    tick(); setInterval(tick, 1000);
  })();
})();
</script>
</body>
</html>
